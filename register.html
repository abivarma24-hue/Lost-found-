<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | REC Lost &amp; Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>REC Lost &amp; Found</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="dashboard.html" data-user hidden>My tags</a>
      <a href="create-tag.html" data-user hidden>New tag</a>
      <button type="button" id="logoutBtn" class="linklike" data-user hidden>Logout</button>
      <a href="login.html" data-guest>Login</a>
      <a href="register.html" class="btn btn-small" data-guest>Register</a>
    </nav>
  </header>

  <main class="narrow">
    <h1>Create your account</h1>
    <p class="muted">You need an account only to make tags. A finder never needs one.</p>

    <form id="registerForm" class="panel">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Your name" autocomplete="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>
      <p class="hint">At least 6 characters.</p>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" minlength="6" autocomplete="new-password" required>

      <p id="msg" class="alert" role="alert" hidden></p>

      <button type="submit" id="submitBtn" class="btn btn-block">Create account</button>
    </form>

    <p style="margin-top:1rem">Already registered? <a href="login.html">Log in</a></p>
  </main>

  <footer class="site-footer">
    <p>REC mini project built with HTML, CSS and JavaScript</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
